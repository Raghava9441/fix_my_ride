name: AI contribution

# Reports what share of a merged pull request an AI agent wrote, using the
# line-level attribution Git AI stores in refs/notes/ai.
#
# The calculation lives in scripts/ai-percentage.js, so the number CI publishes
# is produced by the same code you can run locally:
#     node scripts/ai-percentage.js --pr 2
#
# Today this only reports. The percentage is exposed as a step output, so a
# later Jira step can read steps.calc.outputs.ai_pct without touching anything
# above it.

on:
  pull_request:
    types: [closed]
  # Re-score any PR by number without having to merge something.
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to score
        required: true

permissions:
  contents: write   # git ai ci github run pushes repaired notes back

jobs:
  ai-percentage:
    # Skip PRs that were closed without merging; there is nothing to report.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The PR range is measured against the merge base, which a shallow
          # clone does not contain.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Git AI
        run: |
          set -euo pipefail
          curl -fsSL https://usegitai.com/install.sh | bash
          # The installer edits shell profiles that later steps never source,
          # so put the binary on PATH explicitly.
          echo "$HOME/.git-ai/bin" >> "$GITHUB_PATH"

      - name: Repair attribution across the merge
        # GitHub rewrites commits on squash and rebase merges, which breaks the
        # line mapping. This rebuilds it. Non-fatal, because the script scores
        # the original PR commits, which are unaffected either way.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git ai ci github run

      - name: Calculate the AI percentage
        id: calc
        env:
          # Used by the script for the PR lookup; avoids anonymous rate limits
          # and works on private repos.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number || github.event.inputs.pr }}
        run: |
          set -uo pipefail
          echo "Scoring PR #$PR"

          # GitHub runs `run:` blocks under `bash -e`, so any non-zero exit
          # kills the step immediately. Exit 3 is informational here, not a
          # failure, so -e has to come off around the call. `set -uo pipefail`
          # alone does NOT disable it.
          set +e
          # The script fetches refs/notes/ai and the PR head itself, so no
          # separate fetch step is needed here.
          node scripts/ai-percentage.js --pr "$PR" --github-output --out report.json
          CODE=$?
          set -e

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"

          # Exit 3 means some commits carried no attribution. The run should
          # still surface the numbers, but the percentage understates AI and
          # must not be treated as publishable.
          if [ "$CODE" -eq 3 ]; then
            echo "::warning::Some commits in this PR have no Git AI attribution. The percentage understates AI usage and should not be published."
          elif [ "$CODE" -ne 0 ]; then
            echo "::error::ai-percentage.js failed with exit code $CODE"
            exit "$CODE"
          fi

      - name: Write the run summary
        if: always() && hashFiles('report.json') != ''
        run: |
          set -euo pipefail
          node -e '
            const r = require("./report.json");
            const s = r.result;
            const trusted = s.unattributed.length === 0;
            const out = [
              `## AI contribution - ${r.label}`,
              "",
              `**${s.aiPct}% AI-written** (${s.ai} of ${s.added} added lines)`,
              "",
              "| Bucket | Lines | Share |",
              "|---|---:|---:|",
              `| AI | ${s.ai} | ${s.aiPct}% |`,
              `| Human | ${s.human} | ${s.humanPct}% |`,
              `| Unknown | ${s.unknown} | ${s.unknownPct}% |`,
              "",
              `Attribution present on ${s.commitsAttributed} of ${s.commits} commits.`,
            ];
            if (!trusted) {
              out.push("", `> **Not publishable.** ${s.unattributed.length} commit(s) carry no attribution, so ${s.unknown} line(s) are unknown rather than human.`);
            }
            for (const [model, v] of Object.entries(s.byModel)) {
              out.push("", `\`${model}\` produced ${v.ai_additions} lines, ${v.ai_accepted} still present.`);
            }
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n") + "\n");
          '

      - name: Echo the outputs a later Jira step would consume
        run: |
          echo "ai_pct          = ${{ steps.calc.outputs.ai_pct }}"
          echo "human_pct       = ${{ steps.calc.outputs.human_pct }}"
          echo "unknown_pct     = ${{ steps.calc.outputs.unknown_pct }}"
          echo "added           = ${{ steps.calc.outputs.added }}"
          echo "missing_commits = ${{ steps.calc.outputs.missing_commits }}"

      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('report.json') != ''
        with:
          name: ai-contribution-pr-${{ github.event.pull_request.number || github.event.inputs.pr }}
          path: report.json
