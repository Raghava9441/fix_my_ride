name: AI percentage on push

# Runs scripts/compute-and-update.mjs on every push and logs the AI-contribution
# percentage of the pushed commits. Log-only: no Jira or other API is called.
# It reads refs/notes/ai with plain git, so git-ai does not need to be installed.

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ai-percentage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The range needs the pushed commits' history and refs/notes/ai.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch attribution notes
        run: git fetch --no-tags origin '+refs/notes/ai:refs/notes/ai' || echo "No refs/notes/ai on the remote yet."

      - name: Work out the commit range
        id: range
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          HEAD_SHA="$(git rev-parse HEAD)"
          BASE=""
          # Normal push: everything since the previous tip of this branch.
          if [ -n "${BEFORE:-}" ] && ! echo "$BEFORE" | grep -qE '^0+$' && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            BASE="$BEFORE"
          fi
          # New branch or force-push: everything since it left the default branch.
          if [ -z "$BASE" ]; then
            BASE="$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)"
          fi
          # Pushing the default branch itself: just the last commit.
          if [ -z "$BASE" ] || [ "$BASE" = "$HEAD_SHA" ]; then
            BASE="$(git rev-parse HEAD~1 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "::notice::No earlier commit to compare against; nothing to score."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Calculate and log the AI percentage
        if: steps.range.outputs.skip != 'true'
        env:
          # Commits without attribution (e.g. pushed from a machine without git-ai)
          # are reported as a warning instead of failing the run.
          ALLOW_PARTIAL: "true"
        run: node scripts/compute-and-update.mjs --base "${{ steps.range.outputs.base }}" --head "${{ steps.range.outputs.head }}"
