name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─── Lint, type-check, build, test ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --passWithNoTests

  # ─── Build & push Docker image (main branch only) ──────────────────────────
  build-and-push:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Deploy to server over SSH ──────────────────────────────────────────────
  # Skipped automatically until DEPLOY_HOST is configured (see repo Settings ->
  # Secrets and variables -> Actions). Required secrets:
  #   DEPLOY_HOST        server hostname/IP
  #   DEPLOY_USER        SSH user
  #   DEPLOY_SSH_KEY     private key with access to that user (no passphrase)
  #   DEPLOY_PORT        SSH port (optional, defaults to 22)
  #
  # Prerequisites on the server:
  #   - Docker + docker-compose plugin installed
  #   - This repo's docker-compose.yml checked out (or copied) at DEPLOY_PATH
  #   - A `.env` file next to it (compose's own substitution file, separate
  #     from the app's .env.production) containing:
  #       IMAGE_NAME=ghcr.io/<owner>/<repo>
  #       IMAGE_TAG=latest
  #   - `docker login ghcr.io -u <owner> -p <PAT with read:packages>` already
  #     run once on the server so `docker compose pull` can authenticate
  deploy:
    needs: build-and-push
    if: needs.build-and-push.result == 'success' && secrets.DEPLOY_HOST != ''
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH || '~/fix_my_ride' }}
            docker compose pull app
            docker compose up -d --no-deps app
            docker image prune -f
