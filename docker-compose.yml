# Full local stack: app + MongoDB + Redis.
#
# Usage:
#   docker-compose up -d --build     # start everything
#   docker-compose logs -f app       # tail app logs
#   docker-compose down              # stop (add -v to also wipe data volumes)
#
# The app container talks to `mongo` and `redis` by service name (Docker's
# internal DNS), not `localhost` — that's why MONGODB_URI/REDIS_HOST are
# overridden below even though .env.development points at localhost for
# native (non-Docker) `npm run dev` usage.
#
# `mongo` runs as a single-node replica set (`rs0`), not a plain standalone
# instance — Mongoose transactions (used by the org-onboarding signup flow
# and the admin seed script, both of which create several documents
# atomically) require a replica set to work at all; a standalone mongod
# rejects `startSession()`/transactions outright. `mongo-init` is a one-shot
# container that runs `rs.initiate()` once mongo is up (idempotent — safe on
# every `docker-compose up`), and `app` waits for it to finish before
# starting.

services:
  app:
    # `build:` is used for local dev (`docker-compose up --build`).
    # `image:` is what a server pulls in production, once CI has pushed it
    # (see .github/workflows/ci-cd.yml) — set IMAGE_NAME to your
    # ghcr.io/<owner>/<repo> before deploying to a server.
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-fix-my-ride-app}:${IMAGE_TAG:-latest}
    container_name: fix-my-ride-app
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    env_file:
      - .env.development
    environment:
      MONGODB_URI: mongodb://mongo:27017/fix_my_ride?replicaSet=rs0
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - uploads-data:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - fix-my-ride-net

  mongo:
    image: mongo:7
    container_name: fix-my-ride-mongo
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fix-my-ride-net

  # One-shot: initiates the rs0 replica set once `mongo` is reachable, then
  # exits. Safe to re-run — no-ops if the replica set already exists.
  mongo-init:
    image: mongo:7
    container_name: fix-my-ride-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - fix-my-ride-net
    command: >
      mongosh --host mongo:27017 --quiet --eval
      "try { rs.status(); print('rs0 already initiated'); } catch (e) { print('initiating rs0...'); rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }); }"

  redis:
    image: redis:7-alpine
    container_name: fix-my-ride-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fix-my-ride-net

networks:
  fix-my-ride-net:

volumes:
  mongo-data:
  redis-data:
  uploads-data:
